name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.NYARQ_11_20_TOKEN }}
          user: nyarq
          filename: github-metrics.svg
          # Render to the runner only; the next step commits it after a sanity check.
          output_action: none
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Seoul
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_threshold: 0%
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Commit render when repository data is complete
        run: |
          RENDER=/metrics_renders/github-metrics.svg

          # "0 Languages" means the repositories query came back empty; keep the old card.
          if grep -qE '(^|[^0-9])0 Languages' "$RENDER"; then
            echo "::warning::Repositories query returned nothing, keeping the previous card."
            exit 0
          fi

          cp "$RENDER" github-metrics.svg
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          git diff --staged --quiet || git commit -m "Update github-metrics.svg [skip ci]"
          git push
