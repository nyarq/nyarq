name: GitHub Stats

# Automatic runs are off: the stats cards are not shown in the README.
# To bring them back, restore the schedule below and re-add the cards to README.md.
#  schedule:
#    - cron: "0 0 * * *"
on:
  workflow_dispatch:

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate stats SVG
        env:
          GITHUB_TOKEN: ${{ secrets.NYARQ_11_20_TOKEN }}
        run: python generate_stats.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg github-hours.svg
          git diff --staged --quiet || git commit -m "Update stats cards [skip ci]"
          git push
